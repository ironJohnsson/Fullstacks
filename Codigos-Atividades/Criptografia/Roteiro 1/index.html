<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Roteiro 1 - SHA-256</title>
</head>
<body>
  <input id="entrada" type="text" placeholder="Digite uma informação">
  <button id="gerarBtn" type="button">Gerar SHA-256</button>
  <button id="limparBtn" type="button">Limpar</button>
  <p id="contador">0 caracteres</p>
  <p id="original"></p>
  <pre id="hash"></pre>
  <button id="copiarBtn" type="button">Copiar hash</button>
  <input id="dado1" type="text" placeholder="Dado 1">
  <input id="dado2" type="text" placeholder="Dado 2">
  <button id="compararBtn" type="button">Comparar</button>
  <p id="comparacao"></p>

  <script src="script.js"></script>
</body>
</html>
